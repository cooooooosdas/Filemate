name: FileMate CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install project
        run: uv sync --extra dev
      - name: Set up Node for release gateway contracts
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Static checks
        run: >-
          uv run ruff check
          server.py main.py
          filemate/llm_client filemate/tests/test_llm_client.py
          filemate/execution
          filemate/accounts.py
          filemate/tests/test_accounts.py
          filemate/tests/test_storage.py
          filemate/tests/test_release_contract.py
          filemate/tests/test_deploy_existing.py
          filemate/tests/test_deploy_migration_contract.py
          filemate/tests/test_file_ops.py
          filemate/tests/test_archiver.py
          filemate/tests/test_confirmation_executor.py
          filemate/tests/test_server_persistence.py
          filemate/tests/test_retrieval.py
          filemate/tests/test_study.py
          filemate/tests/test_evaluation_study.py
          filemate/tests/test_evidence_profile.py
          filemate/tests/test_knowledge_graph.py
          filemate/tests/test_beta_tools.py
          filemate/tests/test_backup.py
          filemate/tests/test_career_planning.py
          filemate/tests/test_programming.py
          filemate/tests/test_linux_judge.py
          filemate/tests/test_interview_review.py
          filemate/study
          filemate/programming
          filemate/interview_review
          filemate/career
          filemate/operations
          filemate/speech.py filemate/tests/test_natural_speech.py
          filemate/tests/test_career.py
          filemate/understanding/interview.py
          filemate/understanding/retrieval.py
          evaluation/run_evaluation.py
          evaluation/calibrate_interview.py
          evaluation/analyze_study.py
          evaluation/analyze_competition_trials.py
          evaluation/csv_contract.py
          evaluation/intervals.py
          evaluation/prepare_beta.py
          scripts/acceptance/release_readiness.py
          scripts/acceptance/backup_restore.py
          scripts/acceptance/gateway_preflight.py
          scripts/deploy_existing.py
          evaluation/analyze_feedback.py
      - name: Unit and integration tests
        run: uv run pytest filemate/tests -q -m "not e2e"
      - name: Build Python package
        run: uv build
      - name: Run offline product evaluation
        run: uv run python evaluation/run_evaluation.py --output _working/evaluation-report.json
      - name: Validate user-study analysis pipeline
        run: >-
          uv run python evaluation/analyze_study.py
          --annotations evaluation/datasets/retrieval_annotations.example.csv
          --study evaluation/datasets/user_study.example.csv
          --output _working/user-study-example-report.json
      - name: Validate anonymous feedback analysis pipeline
        run: >-
          uv run python evaluation/analyze_feedback.py
          evaluation/datasets/product_feedback.example.csv
          --output _working/product-feedback-example-report.json
      - name: Validate Beta export pipeline with synthetic examples
        run: >-
          uv run python evaluation/prepare_beta.py
          --study evaluation/datasets/user_study.example.csv
          --output _working/beta-example-export
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v7
        with:
          name: FileMate-offline-evaluation
          path: |
            _working/evaluation-report.json
            _working/user-study-example-report.json
            _working/product-feedback-example-report.json
            _working/beta-example-export
          if-no-files-found: error

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: filemate/web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: filemate/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test, type-check and build
        run: npm test && npm run build && npm run check:bundle

  desktop:
    name: Desktop · Windows installer
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false
          cache-dependency-glob: "requirements-desktop.txt"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: filemate/web/package-lock.json
      - name: Select Rust MSVC toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: filemate/web
        run: npm ci
      - name: Build Sidecar
        working-directory: filemate/web
        run: npm run desktop:sidecar
      - name: Smoke-test Sidecar
        working-directory: filemate/web
        run: npm run desktop:smoke-sidecar
      - name: Build NSIS installer
        working-directory: filemate/web
        run: npm run desktop:bundle
      - name: Smoke-test silent install, runtime, and uninstall
        shell: pwsh
        run: >-
          ./scripts/smoke_windows_installer.ps1
          -BundleRoot ./filemate/web/src-tauri/target/release/bundle
          -EvidencePath ./_working/installer-smoke-evidence.json
          -VerifyInheritedEnvironment
      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: FileMate-Windows-installers
          path: filemate/web/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
      - name: Upload desktop acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FileMate-desktop-acceptance-evidence
          path: |
            _working/**/*evidence.json
            _working/**/*.log
          if-no-files-found: warn
