[package]
name = "filemate-desktop"
version = "1.2.0"
description = "FileMate desktop host"
authors = ["FileMate Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "filemate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
