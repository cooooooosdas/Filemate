name: filemate

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      FILEMATE_HOST: 0.0.0.0
      FILEMATE_PORT: 8001
      FILEMATE_DATA_DIR: /data
      FILEMATE_DB_PATH: /data/filemate.db
      FILEMATE_UPLOAD_DIR: /data/inbox
      FILEMATE_ARCHIVE_DIR: /data/archive
    volumes:
      - filemate_data:/data
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  filemate_data:
  caddy_data:
  caddy_config:
