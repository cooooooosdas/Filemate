# Existing systemd backend + Nginx Proxy Manager deployment example.
# Verify the container network upstream and certificate paths before applying.
map $uri $filemate_api_path {
    default 0;
    ~^/api/ 1;
    ~^/process$ 1;
    ~^/sessions 1;
    ~^/ai/ 1;
    ~^/knowledge 1;
    ~^/quiz 1;
    ~^/wrongbook 1;
    ~^/interview(/|$) 1;
    ~^/interviews 1;
    ~^/analytics 1;
    ~^/review 1;
    ~^/study-plans 1;
    ~^/evaluation 1;
    ~^/goals 1;
    ~^/trust 1;
    ~^/agents 1;
}

map $http_accept $filemate_accepts_html {
    default 0;
    ~*text/html 1;
}

map "$filemate_api_path:$filemate_accepts_html" $filemate_proxy_api {
    default 0;
    "1:0" 1;
}

limit_req_zone $binary_remote_addr zone=filemate_api_per_ip:10m rate=120r/m;

map $uri $filemate_ai_limit_key {
    default "";
    ~^/ai/ $binary_remote_addr;
    ~^/knowledge/sources/[^/]+/artifacts$ $binary_remote_addr;
    ~^/interviews/[^/]+/answers$ $binary_remote_addr;
}

limit_req_zone $filemate_ai_limit_key zone=filemate_ai_per_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=filemate_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name filemate.asia www.filemate.asia;
    if (-f /data/filemate/maintenance.flag) { return 503; }
    server_tokens off;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /data/letsencrypt-acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name filemate.asia www.filemate.asia;
    if (-f /data/filemate/maintenance.flag) { return 503; }
    ssl_certificate /etc/letsencrypt/live/filemate.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filemate.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FileMateSSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 120s;
    limit_req_status 429;
    limit_conn_status 429;
    root /data/filemate/current;
    index index.html;
    access_log /data/logs/filemate_access.log combined;
    error_log /data/logs/filemate_error.log warn;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location ^~ /settings/ { return 404; }
    location ^~ /internal/ { return 404; }

    location ^~ /interview-vision/ {
        gzip on;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_types text/css application/javascript application/wasm application/octet-stream;
        types { application/wasm wasm; application/javascript js; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        gzip on;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_types text/css application/javascript application/wasm;
        try_files $uri =404;
    }

    location / {
        if ($filemate_proxy_api) { return 418; }
        try_files $uri $uri/ /index.html;
    }

    error_page 418 = @filemate_api;
    location @filemate_api {
        limit_req zone=filemate_api_per_ip burst=30 nodelay;
        limit_req zone=filemate_ai_per_ip burst=6 nodelay;
        limit_conn filemate_conn_per_ip 20;
        proxy_pass http://172.18.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
    }
}
