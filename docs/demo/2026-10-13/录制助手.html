<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileMate｜5分钟录制助手</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f0ff;color:#10254c;font-family:"Microsoft YaHei",system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer;border:1px solid #a9bde9;border-radius:10px;padding:10px 16px;background:white;color:#10254c;min-height:44px}button:hover,a:hover{background:#dfeaff}button:focus-visible,a:focus-visible{outline:3px solid #ffcc67;outline-offset:3px}header{display:flex;justify-content:space-between;gap:20px;padding:24px 32px;background:#142d67;color:white;align-items:center}h1{font-size:27px;margin:0 0 6px}.sub{font-size:16px;color:#bdcff1}.clock{font-size:40px;font-variant-numeric:tabular-nums;font-weight:700}.layout{display:grid;grid-template-columns:280px 1fr;max-width:1600px;margin:auto;gap:24px;padding:24px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left;display:flex;gap:10px;align-items:center}nav button[aria-current=true]{background:#2454d9;color:white;border-color:#2454d9}.num{font-size:24px;width:35px}.time{font-size:15px;display:block;opacity:.8}.paper{background:white;border:1px solid #c8d7f0;border-radius:18px;padding:28px;box-shadow:0 10px 30px #1836720b}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.controls .primary{background:#2454d9;color:white}h2{font-size:25px;margin:0 0 14px}.speech{font-size:30px;line-height:1.95;white-space:pre-wrap;max-width:42em;letter-spacing:.015em}.operations{font-size:19px;line-height:1.8;background:#f3f6fc;padding:20px;border-radius:12px;margin-top:28px;white-space:pre-wrap}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.links a{font-size:17px;color:#1948be;border:1px solid #b9cdee;border-radius:8px;text-decoration:none;padding:10px 14px}.bar{height:5px;background:#ffcf77;width:0;transition:width .2s}.notice{font-size:16px;line-height:1.6;color:#546987;margin:18px 0}label{font-size:16px}.range{width:110px}footer{font-size:16px;padding:12px 30px 30px;color:#546987}.copy{margin-top:18px}#status{font-size:16px;color:#2454d9}.operator-hidden .operations,.operator-hidden .links,.operator-hidden .notice{display:none}@media(max-width:800px){header{padding:18px}.layout{display:flex;flex-direction:column;padding:14px}nav{flex-direction:row;overflow:auto}nav button{min-width:170px}.paper{padding:20px}.speech{font-size:27px}.clock{font-size:32px}h1{font-size:22px}}
</style></head><body><header><div><h1>FileMate · 5分钟录制助手</h1><div class="sub">12段口播 / 同学操作 / 已保存结果直达</div></div><div class="clock" id="clock">0:00 / 5:00</div></header><div class="bar" id="bar"></div><div class="layout"><nav id="nav" aria-label="录制段落"></nav><main class="paper"><div class="controls"><button class="primary" id="start">开始计时</button><button id="reset">重置计时</button><button id="prev">上一段</button><button id="next">下一段</button><label><input type="checkbox" id="auto">按时间切段</label><label>字号 <input class="range" type="range" min="24" max="44" value="30" id="font"></label><label><input type="checkbox" id="reader">纯口播</label></div><h2 id="title"></h2><div class="speech" id="speech"></div><div class="copy"><button id="copySpeech">复制本段口播</button> <button id="copyAll">复制完整口播</button> <span role="status" id="status"></span></div><div class="operations" id="operations"></div><div class="links" id="links"></div><p class="notice">打开链接前，先在同一浏览器登录专用演示账户。密码、恢复码另行提供。导师段主稿按当前语音故障准备；恢复后替代段见操作稿。计时只用于排练，实际录制请按自己的语速调整。</p></main></div><footer>原创合成资料 · 实际网站操作记录 · 本页不上传任何内容。成果与复制材料在同一文件夹内。</footer><script>
const segments=[{"title": "从学习到求职", "seconds": 20, "script": "大家好，这是 FileMate，一个面向大学生的 AI 学习工作台。接下来，我用一份数据结构资料，演示从课程学习、编程纠错，到面试和求职准备的过程。本次使用原创合成资料，页面中的作答和判题记录来自实际操作。", "keys": ["home"], "actions": "停在已登录首页，鼠标沿左侧主要功能缓慢移动一次。不要打开账号密码窗口。介绍到“原创合成资料”时，画面放一个短字幕：原创合成演示资料。", "start": 0, "end": 20, "time": "0:00–0:20", "links": [{"label": "home", "url": "https://filemate.asia/"}]}, {"title": "资料导入与归档", "seconds": 30, "script": "首先，从统一入口添加课程资料。选择阅读，可以保留原文；选择归档，则先核对分类、文件名和目标位置，确认后再执行。学习工作区把同一份资料的摘要、笔记、知识卡片和练习放在一起。这些内容已经提前生成并保存，现在可以直接回看，不必反复上传。", "keys": ["archive", "summary"], "actions": "0:20–0:27 在首页点“添加资料”，展示“阅读与学习 / 整理与归档”两种用途，不重复上传；0:27–0:36 切到已打开的归档审核页，指向可编辑文件名、归档预览和“确认并归档”，保持预览，不点击确认；0:36–0:50 切学习工作区，点摘要、笔记、卡片各一次。只展示保存结果，不在录制时重新请求模型。", "start": 20, "end": 50, "time": "0:20–0:50", "links": [{"label": "archive", "url": "https://filemate.asia/classification?session=8fd5ef158fb2"}, {"label": "summary", "url": "https://filemate.asia/ai-tools?source=674c7bd4d57c5b63b18c775055798ffd&ctx=5d12cb0b4c8348a097434b2fef1f75be&artifact=a776d95040744376b7e32cf70ea28c54"}]}, {"title": "有引用的问答与图谱", "seconds": 30, "script": "遇到不懂的地方，我可以直接问：栈和队列有什么区别？回答下方能打开引用，回到原文核对。这里的知识图谱用本地规则从资料提取，经过确认后，连接栈、队列和搜索方法。点击节点可以查看来源。回答和图谱都应该能找到依据，不能只留下一个听起来正确的结论。", "keys": ["summary", "graph"], "actions": "0:50–1:07 在同一学习工作区回看已保存的“栈和队列有什么区别”回答，点“引用 1 · 原文片段”，让原文停留约4秒；1:07–1:20 切知识图谱，点击“栈”节点，展示来源和与深度优先搜索的连接。这个图谱本次是 local_rules，不称为“模型已成功生成”。", "start": 50, "end": 80, "time": "0:50–1:20", "links": [{"label": "summary", "url": "https://filemate.asia/ai-tools?source=674c7bd4d57c5b63b18c775055798ffd&ctx=5d12cb0b4c8348a097434b2fef1f75be&artifact=a776d95040744376b7e32cf70ea28c54"}, {"label": "graph", "url": "https://filemate.asia/knowledge-graph"}]}, {"title": "目标、计划与学习 Agent", "seconds": 30, "script": "接着，把学习目标变成下一步行动。我设定两周内复习栈、队列和数组边界，每天安排三十分钟。目标反推给出任务，学习计划按日期保存，今日学习再结合错题和可用时间安排顺序。需要执行的操作可以回看处理过程；计划完成由我确认，系统不会替我假装已经学会。", "keys": ["goals", "plan", "today", "trust"], "actions": "1:20–1:28 切目标反推，点已有的“两周内掌握栈、队列和数组边界（演示）”卡片，展开任务；1:28–1:39 切已保存学习计划，展示日程和完成勾选，不提交新计划；1:39–1:47 切今日学习，指向可用时长、复习原因；1:47–1:50 切可信与隐私的“处理过程”，展示目标/归档任务的一条运行记录。此页提前滚到该部分。", "start": 80, "end": 110, "time": "1:20–1:50", "links": [{"label": "goals", "url": "https://filemate.asia/goals"}, {"label": "plan", "url": "https://filemate.asia/study-plan?plan=98ea49d5542747faa3c737e14319531c"}, {"label": "today", "url": "https://filemate.asia/today"}, {"label": "trust", "url": "https://filemate.asia/trust"}]}, {"title": "错题与间隔复习", "seconds": 20, "script": "做错的练习会进入错题本，保留我的答案、解释和复习安排。今日学习把需要复习的题放进队列，再次作答后更新记录。一次答对，不等于已经掌握；错题仍按连续作答规则跟踪。这样，资料、练习和复习就连成了一条可以回看的学习路径。", "keys": ["wrongbook", "today"], "actions": "1:50–2:02 切错题复盘，展开第一道已保存错题，展示原题、错误答案、解释；2:02–2:10 切今日学习的复习任务，指向“提交答案 / 完整复盘”。本次不提交第二次正确答案，以保留后续多次录制的错题展示。", "start": 110, "end": 130, "time": "1:50–2:10", "links": [{"label": "wrongbook", "url": "https://filemate.asia/wrongbook"}, {"label": "today", "url": "https://filemate.asia/today"}]}, {"title": "导师讲解与当前语音边界", "seconds": 17, "script": "讲解页提供声线、语速和字幕控制，自然声音需要在线服务。目前供应商暂时不可用，这里展示文字与控制入口。我们保留文字讲解，并明确提示故障，不用假音频代替真实播放。", "keys": ["tutor"], "actions": "2:10–2:27 切 AI 导师讲解，提前把资料/04 中的短讲解填入正文，显示晓晓、云夏选项、语速和字幕控制。按本次真实故障版本录，不点击后一直等待，不播放伪造音频。录前如果两种声线实际播放均恢复，才使用文档中的替代段，并预留8秒真实声音。", "start": 130, "end": 147, "time": "2:10–2:27", "links": [{"label": "tutor", "url": "https://filemate.asia/digital-human"}]}, {"title": "编译器判题与 AI 编程教练", "seconds": 37, "script": "编程环节，我们练习校园消费合计。这份代码可以编译，但用 int 累加，大整数测试会出错。这里显示实际判题结果：错误答案，以及失败测试点的输入、预期输出和实际输出。AI 教练根据代码与结果给出复盘建议，提示整数溢出风险；这些建议会标明是 AI 推测。把累计和改成 long long 后，再看实际提交，所有测试点通过。最终是否通过，由编译器和测试决定。", "keys": ["wrongCode", "correctCode"], "actions": "2:27–2:37 切错误提交，提前滚到“评测结果 WA”，展开“4. 64 位边界”，指向预期与实际输出；2:37–2:49 展开“查看这次提交的原始代码”，定位 int sum，再展示已保存“AI 推测与建议”；2:49–3:04 切修正版提交，展开原始代码定位 long long sum，展示 AC 与 6/6 测试点。两份提交都已由公网 gVisor 真实评测；视频展示已保存结果，不冒充现场瞬间判题。可另外补录一次“提交并评测”按钮和实际等待过程，后期适当加速并标注。", "start": 147, "end": 184, "time": "2:27–3:04", "links": [{"label": "wrongCode", "url": "https://filemate.asia/programming?submission=e3a8297d291c4d1dbdf9b92bad7fbada"}, {"label": "correctCode", "url": "https://filemate.asia/programming?submission=5b2c26ede7d345aeb86eaa4d1c851cc9"}]}, {"title": "面试训练与有依据的复盘", "seconds": 35, "script": "学习成果还需要讲清楚。模拟面试支持技术、项目、算法、英语等训练方向，回答后可以继续追问。我提前完成了一道技术题，报告保留原回答，并说明哪些内容需要补充，能回到具体句子核对。摄像头和本地视觉观察需要另行授权，面部动作不等于紧张或开心的概率。这里没有语音和视频样本，所以相关项目显示待评测，不补造分数。", "keys": ["interview"], "actions": "3:04–3:12 切模拟面试，展示已恢复技术面与题目/回答记录。若要展示全部训练模式，录前另开 /interview 空白页展示模式按钮，随后切回已保存面试，不点重置；3:12–3:29 滚到“面试复盘报告”，点“专业内容与逻辑结构”下的“第1题 · 模型参考建议”展开原文依据，展示内容分析成功；3:29–3:39 指向“语音证据 0 题 / 视觉采样 0 / 待评测”及摄像头授权说明。本次不代替用户开启设备，不声称情绪识别。", "start": 184, "end": 219, "time": "3:04–3:39", "links": [{"label": "interview", "url": "https://filemate.asia/interview?interview=0498fc062ff54221"}]}, {"title": "岗位要求与原创模拟笔试", "seconds": 23, "script": "求职训练把目标岗位的要求和现有记录放在一起。我导入一个明确标注为虚构的练习岗位，核对数据结构和 C++ 要求，再查看对应的作答与编程证据。模拟笔试使用平台原创基础题和算法题，用来发现薄弱项，不冒充企业真题，也不预测录用概率。", "keys": ["career"], "actions": "3:39–3:48 切已保存的“演示团队（虚构训练岗位）”，显示来源与岗位标签；3:48–3:55 指向“岗位要求与训练证据”中的 AC/WA 记录；3:55–4:02 滚到已保存“模拟笔试”，展示两道原创题和本轮 0/2 的真实结果。不要改成满分，不点“创建模拟笔试”重建。", "start": 219, "end": 242, "time": "3:39–4:02", "links": [{"label": "career", "url": "https://filemate.asia/career?position=2104c3b308ff4ec89e05d314ea0cbbaf&training=e998711c88f14f1f944fedcb8dbcc206"}]}, {"title": "事实驱动的简历导出", "seconds": 16, "script": "简历从本人确认的事实出发，可以关联实际编程记录。本次用合成经历直接排版，展示已保存简历，并导出 PDF 和 Word。AI 选材也需要单独授权，不能替用户编造奖项、实习或项目成果。", "keys": ["resume"], "actions": "4:02–4:09 切我的简历，展示个人事实与关联 AC 记录；4:09–4:18 点击“最近30份简历”中的已保存项，点“下载 PDF”，切到事先打开的“成果/演示简历.pdf”，Word 下载入口停留一秒。AI选材选项存在，本次结果为直接排版，不说是AI润色结果。", "start": 242, "end": 258, "time": "4:02–4:18", "links": [{"label": "resume", "url": "https://filemate.asia/resume"}]}, {"title": "技能、学期与成长报告", "seconds": 19, "script": "技能树把目标和验收记录关联，学期模式按课程安排任务。成长报告汇总实际作答、判题、面试回答和任务完成，点击即可回看依据。样本不足时，画像与评分保持待评测，不把短期演示写成学习效果已经提升。", "keys": ["skills", "semester", "growth"], "actions": "4:18–4:23 切技能树，展示“数组求和与整数边界”条件达成及二分查找待评测；4:23–4:28 切学期模式，展示数据结构/C++课程和一项自报完成任务；4:28–4:37 切成长数据，录前点击“最近30份报告”打开已保存报告，滚到“记录依据”，展示实际条数和不足5条待评测，可点下载报告 PDF。", "start": 258, "end": 277, "time": "4:18–4:37", "links": [{"label": "skills", "url": "https://filemate.asia/skills"}, {"label": "semester", "url": "https://filemate.asia/semester"}, {"label": "growth", "url": "https://filemate.asia/growth"}]}, {"title": "数据控制与收束", "seconds": 23, "script": "最后，用户可以导出个人数据和整包备份，删除资料前先看影响，再确认执行；恢复也需要校验与预览。本次演示账户已经完成备份、删除便条和恢复验证。FileMate 希望把分散的资料，变成有依据、有下一步、可持续复盘的学习过程。这就是本次演示，谢谢大家。", "keys": ["trust", "home"], "actions": "4:37–4:50 切可信与隐私，提前滚到“导出与恢复个人数据”，指向导出 JSON、整包备份和校验预览。恢复操作已在该专用账户真实验证，正片不再恢复旧备份以免覆盖新的演示记录；可另录私有账户中99便条的删除预览，不展示恢复码；4:50–5:00 回首页，停在主标题，保留约1秒后结束录制。", "start": 277, "end": 300, "time": "4:37–5:00", "links": [{"label": "trust", "url": "https://filemate.asia/trust"}, {"label": "home", "url": "https://filemate.asia/"}]}];let active=0,elapsed=0,running=false,last=0;const get=id=>document.getElementById(id);const labels={home:'学习工作台',archive:'归档审核',summary:'引用问答与学习内容',graph:'知识图谱',goals:'目标反推',plan:'学习计划',today:'今日学习',trust:'可信与隐私',wrongbook:'错题复盘',tutor:'导师讲解',wrongCode:'错误提交 WA',correctCode:'修正提交 AC',interview:'技术面与报告',career:'岗位与笔试',resume:'我的简历',growth:'成长报告',skills:'技能树',semester:'学期模式'};
segments.forEach((s,i)=>{let b=document.createElement('button');b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+s.title+'<span class="time">'+s.time+'</span></span>';b.onclick=()=>show(i);get('nav').append(b)});
function show(i){active=Math.max(0,Math.min(segments.length-1,i));const s=segments[active];get('title').textContent=s.time+' · '+s.title;get('speech').textContent=s.script;get('operations').textContent='同学操作：\n'+s.actions;get('links').replaceChildren(...s.links.map(x=>{const a=document.createElement('a');a.textContent=labels[x.label]||x.label;a.href=x.url;a.target='_blank';a.rel='noopener';return a}));[...get('nav').children].forEach((b,j)=>b.setAttribute('aria-current',j===active?'true':'false'));get('prev').disabled=active===0;get('next').disabled=active===segments.length-1}
function display(){const t=Math.floor(elapsed);get('clock').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+' / 5:00';get('bar').style.width=elapsed/3+'%'}
get('start').onclick=()=>{if(elapsed>=300)elapsed=0;running=!running;last=performance.now();get('start').textContent=running?'暂停计时':'继续计时'};get('reset').onclick=()=>{running=false;elapsed=0;get('start').textContent='开始计时';show(0);display()};get('prev').onclick=()=>show(active-1);get('next').onclick=()=>show(active+1);get('font').oninput=e=>get('speech').style.fontSize=e.target.value+'px';get('reader').onchange=e=>document.body.classList.toggle('operator-hidden',e.target.checked);
async function copy(text){try{await navigator.clipboard.writeText(text);get('status').textContent='已复制'}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();get('status').textContent=copied?'已复制':'请选择口播文字后复制'}}get('copySpeech').onclick=()=>copy(segments[active].script);get('copyAll').onclick=()=>copy(segments.map(s=>s.script).join('\n\n'));
setInterval(()=>{if(!running)return;const now=performance.now();elapsed=Math.min(300,elapsed+(now-last)/1000);last=now;if(get('auto').checked){const idx=segments.findIndex(s=>elapsed<s.end);if(idx>=0&&idx!==active)show(idx)}if(elapsed>=300){running=false;get('start').textContent='重新计时'}display()},200);show(0);display();
</script></body></html>
